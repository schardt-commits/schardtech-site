name: Atualizar vídeos recentes

on:
  schedule:
    - cron: '0 12 * * *'  # 12h UTC = 9h horário de Brasília
  workflow_dispatch:       # permite rodar manualmente pelo GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Pinado por SHA (M4): o job tem contents:write + secret — tag móvel comprometida
      # poderia exfiltrar o secret ou push malicioso no repo que publica o site
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Buscar últimos vídeos e atualizar script.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python update_videos.py

      # Falha o job ANTES do commit se o script.js ficou inválido (M1):
      # JS quebrado aqui derrubaria preço/busca/vídeos de todas as páginas
      - name: Validar script.js
        run: node --check script.js

      - name: Fazer commit se houve mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --staged --quiet || git commit -m "chore: atualizar vídeos recentes"
          # VM pusha rodada de preços ~09:10 BRT (esta action roda 09h BRT): rebase evita push rejeitado
          git pull --rebase
          git push
